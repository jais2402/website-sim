<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand — motion website</title>
    <meta name="description" content="Replace with a one-sentence description of the site." />
    <meta name="theme-color" content="#0b0b0d" />
    <script>
      // Hide intro elements until their entrance animation starts (never for reduced motion).
      // The timeout reveals them anyway if the scripts fail to load.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('motion')
        setTimeout(() => document.documentElement.classList.remove('motion'), 4000)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
