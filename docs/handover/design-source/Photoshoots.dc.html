<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Latest Photoshoots</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=Noto+Serif+Tamil:wght@400;500&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<section id="gallery" aria-labelledby="ps-h" style="width: 100%; box-sizing: border-box; padding: 96px 0; background: #0A0A0A; color: #F3EDE3; font-family: Inter, system-ui, sans-serif; line-height: 1.6; border-top: 1px solid rgba(243,237,227,0.08)">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 48px">
<div>
<h2 id="ps-h" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 64px; line-height: 1.05">Latest Photoshoots</h2>
</div>
<a href="#gallery" style="color: #0A0A0A; background: #F3EDE3; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; gap: 10px; padding: 0 22px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase">
View all
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="#0A0A0A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
</div>

<div style="columns: 4 240px; column-gap: 12px">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="8">
<figure onMouseEnter="{{p.enter}}" onMouseLeave="{{p.leave}}" style="position: relative; break-inside: avoid; margin: 0 0 12px; aspect-ratio: {{p.ratio}}; background: {{p.bg}}; overflow: hidden">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 18px; background: linear-gradient(180deg, rgba(10,10,10,0) 35%, rgba(10,10,10,0.88) 100%); opacity: {{p.overlay}}; transition: opacity 240ms ease">
<sc-if value="{{p.hasMsg}}" hint-placeholder-val="{{ false }}">
<figcaption style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; line-height: 1.3; color: #F3EDE3">{{p.msg}}</figcaption>
</sc-if>
<a href="#" download onFocus="{{p.enter}}" onBlur="{{p.leave}}" aria-label="{{p.label}}" style="align-self: flex-start; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid rgba(243,237,227,0.6); color: #F3EDE3; text-decoration: none; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase">
<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11" fill="none" stroke="#F3EDE3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
Download
</a>
</div>
</figure>
</sc-for>
</div>
<div style="font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #6E6A63; margin-top: 16px">Hover or tap a photo to download it · message shows only when one is set</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hover: 0 }; }
  renderVals() {
    const tones = ['#2f2823', '#2a2420', '#332a24', '#262019'];
    const base = [
      { ratio: '4 / 5', msg: '[Optional message from Simran or the team]' },
      { ratio: '3 / 2', msg: '' },
      { ratio: '2 / 3', msg: '' },
      { ratio: '16 / 9', msg: '[Optional message]' },
      { ratio: '4 / 5', msg: '' },
      { ratio: '4 / 3', msg: '' },
      { ratio: '2 / 3', msg: '' },
      { ratio: '3 / 2', msg: '' },
      { ratio: '1 / 1', msg: '' },
      { ratio: '4 / 3', msg: '' }
    ];
    const h = this.state.hover;
    const photos = base.map((p, i) => ({
      ...p,
      hasMsg: !!p.msg,
      label: 'Download photo ' + (i + 1),
      bg: 'linear-gradient(' + (150 + i * 12) + 'deg,' + tones[i % 4] + ' 0%,#151210 60%,#0d0c0b 100%)',
      overlay: h === i ? 1 : 0,
      enter: () => this.setState({ hover: i }),
      leave: () => this.setState({ hover: -1 })
    }));
    return { photos };
  }
}
</script>
</body>
</html>
