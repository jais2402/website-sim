<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile hero — 9:16 crop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=Noto+Serif+Tamil:wght@400;500&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.footage{background:radial-gradient(ellipse 90% 45% at 50% 38%,#3a3029 0%,#1c1714 50%,#0A0A0A 100%)}
</style>
</helmet>
<div class="footage" style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #F3EDE3; font-family: Inter, sans-serif">
<div style="position: absolute; top: 24px; left: 20px; right: 20px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #A39E95; line-height: 1.6">Vertical crop framed on the face · ≤ 2–3 MB · pin ≈ 180–200vh</div>
<div style="position: absolute; left: 0; right: 0; top: 560px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 8px; color: {{ink}}">
<span lang="ta" style="font-family: 'Noto Serif Tamil', serif; font-weight: 500; font-size: 24px; line-height: 1">சிம்ரன்</span>
<span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 28px; line-height: 1">Simran</span>
</div>
<div style="font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: #A39E95">Signature placeholder</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 32px; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: #A39E95">Actor · Producer · Director</span>
<button type="button" aria-label="Watch reel" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(243,237,227,0.3); border-radius: 50%">
<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="none" stroke="#F3EDE3" stroke-width="1.2" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink":{"editor":"color","default":"#F3EDE3","options":["#F3EDE3","#C4A35A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { ink: this.props.ink ?? '#F3EDE3' }; }
}
</script>
</body>
</html>
