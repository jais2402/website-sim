<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Honours — trophy wall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=Noto+Serif+Tamil:wght@400;500&amp;family=Inter:wght@400;500&amp;family=Oswald:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<section id="honours" aria-labelledby="hn-h" style="position: relative; width: 100%; box-sizing: border-box; padding: 104px 0 112px; overflow: hidden; background: linear-gradient(118deg, transparent 0%, transparent 52%, rgba(255,214,160,0.07) 58%, rgba(255,214,160,0.10) 62%, transparent 70%), radial-gradient(ellipse 50% 40% at 80% 10%, rgba(255,200,140,0.12) 0%, transparent 70%), radial-gradient(circle at 20% 70%, rgba(255,255,255,0.025) 0 1px, transparent 2px) 0 0 / 7px 7px, linear-gradient(180deg, #17313a 0%, #112630 55%, #0b1a20 100%); color: #F3EDE3; font-family: Inter, system-ui, sans-serif; line-height: 1.6">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 24px">
<div>
<h2 id="hn-h" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 64px; line-height: 1.05">Honours</h2>
<p style="margin: 8px 0 0; color: #C9D3D2; font-size: 16px">Hover over a trophy to read the citation.</p>
</div>
<span lang="ta" style="font-family: 'Noto Serif Tamil', serif; font-size: 22px; color: #E3C77F">விருதுகள்</span>
</div>

<div style="position: relative; height: 760px">
<sc-for list="{{shelves}}" as="sh" hint-placeholder-count="4">
<div style="position: absolute; left: {{sh.left}}; top: {{sh.top}}; width: {{sh.width}}">
<div aria-hidden="true" style="position: absolute; left: 10%; right: 10%; bottom: 0; height: 280px; background: radial-gradient(ellipse 60% 100% at 50% 100%, rgba(255,210,150,0.16) 0%, transparent 70%); pointer-events: none"></div>
<div style="position: relative; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 18px">
<sc-for list="{{sh.items}}" as="a" hint-placeholder-count="3">
<div style="position: relative; display: flex; flex-direction: column; align-items: center; z-index: {{a.z}}">
<div role="tooltip" id="{{a.tipId}}" style="position: absolute; bottom: calc(100% + 12px); left: 50%; width: 270px; transform: translateX(-50%) translateY({{a.tipY}}) scale({{a.tipS}}); transform-origin: 50% 100%; opacity: {{a.tipO}}; transition: opacity 260ms ease, transform 380ms cubic-bezier(0.2, 0.9, 0.3, 1.25); pointer-events: none; z-index: 40">
<div style="padding: 20px 22px 18px; background: linear-gradient(160deg, #F6EEDD 0%, #E9DCC3 100%); color: #1d1510; box-shadow: 0 24px 50px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(196,163,90,0.6)">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<span style="font-family: Oswald, sans-serif; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #7A1F24">{{a.kind}}</span>
<span style="font-family: Oswald, sans-serif; font-size: 18px; color: #9C7E3C">{{a.count}}</span>
</div>
<div style="font-family: 'Cormorant Garamond', serif; font-size: 26px; line-height: 1.1; margin-top: 6px">{{a.title}}</div>
<div style="height: 1px; background: rgba(156,126,60,0.5); margin: 12px 0"></div>
<div style="font-size: 13px; line-height: 1.5; color: #3a2c1e">{{a.detail}}</div>
<div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6e5a38; margin-top: 10px">{{a.when}}</div>
</div>
<div aria-hidden="true" style="width: 18px; height: 18px; margin: -9px auto 0; background: #E9DCC3; transform: rotate(45deg); box-shadow: 1px 1px 0 rgba(196,163,90,0.6)"></div>
</div>

<button type="button" onMouseEnter="{{a.on}}" onMouseLeave="{{a.off}}" onFocus="{{a.on}}" onBlur="{{a.off}}" aria-describedby="{{a.tipId}}" aria-label="{{a.aria}}" style="position: relative; background: transparent; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; transform: translateY({{a.lift}}); transition: transform 380ms cubic-bezier(0.2, 0.9, 0.3, 1.25), filter 300ms ease; filter: {{a.glow}}">
<sc-if value="{{a.isCup}}" hint-placeholder-val="{{ true }}">
<svg width="{{a.w}}" height="{{a.h}}" viewBox="0 0 120 200" aria-hidden="true"><defs><linearGradient id="m-gold" x1="0" x2="1"><stop offset="0" stop-color="#7a5a1e"></stop><stop offset="0.3" stop-color="#F8E3A3"></stop><stop offset="0.55" stop-color="#D4AF5A"></stop><stop offset="1" stop-color="#6b4f1a"></stop></linearGradient><linearGradient id="m-silver" x1="0" x2="1"><stop offset="0" stop-color="#6c7378"></stop><stop offset="0.3" stop-color="#F4F6F7"></stop><stop offset="0.55" stop-color="#B8C0C4"></stop><stop offset="1" stop-color="#5a6166"></stop></linearGradient></defs><path d="M28 14h64v40c0 24-14 40-32 40S28 78 28 54z" fill="url(#m-{{a.metal}})"></path><path d="M28 22c-15 0-22 9-20 20 2 12 13 18 24 18" fill="none" stroke="url(#m-{{a.metal}})" stroke-width="6"></path><path d="M92 22c15 0 22 9 20 20-2 12-13 18-24 18" fill="none" stroke="url(#m-{{a.metal}})" stroke-width="6"></path><path d="M38 30h44" stroke="rgba(255,255,255,0.35)" stroke-width="2"></path><rect x="54" y="92" width="12" height="36" fill="url(#m-{{a.metal}})"></rect><ellipse cx="60" cy="110" rx="12" ry="6" fill="url(#m-{{a.metal}})"></ellipse><path d="M40 128h40l6 14H34z" fill="url(#m-{{a.metal}})"></path><rect x="24" y="142" width="72" height="54" rx="2" fill="{{a.base}}"></rect><rect x="38" y="156" width="44" height="22" fill="url(#m-gold)" opacity="0.85"></rect></svg>
</sc-if>
<sc-if value="{{a.isStar}}" hint-placeholder-val="{{ false }}">
<svg width="{{a.w}}" height="{{a.h}}" viewBox="0 0 120 200" aria-hidden="true"><defs><linearGradient id="s-gold" x1="0" x2="1"><stop offset="0" stop-color="#7a5a1e"></stop><stop offset="0.4" stop-color="#FBE7AE"></stop><stop offset="1" stop-color="#6b4f1a"></stop></linearGradient></defs><path d="M60 6l12 24 26 4-19 18 5 26-24-13-24 13 5-26-19-18 26-4z" fill="url(#s-gold)"></path><path d="M60 78c-14 0-22 12-22 24 0 14 10 24 22 24s22-10 22-24c0-12-8-24-22-24z" fill="url(#s-gold)"></path><rect x="54" y="124" width="12" height="10" fill="url(#s-gold)"></rect><path d="M42 134h36l5 10H37z" fill="url(#s-gold)"></path><rect x="28" y="144" width="64" height="52" rx="2" fill="{{a.base}}"></rect><rect x="40" y="158" width="40" height="20" fill="url(#s-gold)" opacity="0.85"></rect></svg>
</sc-if>
<sc-if value="{{a.isCrystal}}" hint-placeholder-val="{{ false }}">
<svg width="{{a.w}}" height="{{a.h}}" viewBox="0 0 120 200" aria-hidden="true"><defs><linearGradient id="c-gl" x1="0" x2="1"><stop offset="0" stop-color="rgba(200,230,240,0.35)"></stop><stop offset="0.45" stop-color="rgba(255,255,255,0.9)"></stop><stop offset="0.55" stop-color="rgba(180,215,230,0.45)"></stop><stop offset="1" stop-color="rgba(140,180,200,0.3)"></stop></linearGradient></defs><path d="M60 4l24 32v108H36V36z" fill="url(#c-gl)" stroke="rgba(255,255,255,0.6)" stroke-width="1"></path><path d="M60 4v140M36 36l24 14 24-14" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"></path><rect x="26" y="144" width="68" height="52" rx="2" fill="{{a.base}}"></rect><rect x="38" y="158" width="44" height="20" fill="#D4AF5A" opacity="0.85"></rect></svg>
</sc-if>
<sc-if value="{{a.isPlaque}}" hint-placeholder-val="{{ false }}">
<svg width="{{a.w}}" height="{{a.h}}" viewBox="0 0 140 170" aria-hidden="true"><defs><linearGradient id="p-gold" x1="0" x2="1"><stop offset="0" stop-color="#7a5a1e"></stop><stop offset="0.45" stop-color="#F8E3A3"></stop><stop offset="1" stop-color="#6b4f1a"></stop></linearGradient></defs><rect x="2" y="2" width="136" height="166" rx="3" fill="#3e2614"></rect><rect x="12" y="12" width="116" height="146" fill="#1b2a44"></rect><path d="M58 22h10l6 30H64zM82 22H72l-6 30h10z" fill="#7A1F24"></path><circle cx="70" cy="80" r="30" fill="url(#p-gold)"></circle><circle cx="70" cy="80" r="22" fill="none" stroke="rgba(107,79,26,0.7)" stroke-width="2"></circle><path d="M70 66l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="#8a6a2a"></path><rect x="34" y="124" width="72" height="20" fill="url(#p-gold)"></rect></svg>
</sc-if>
</button>
</div>
</sc-for>
</div>
<sc-if value="{{sh.plank}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position: relative; height: 20px; border-radius: 2px; background: repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0 3px, transparent 3px 17px), linear-gradient(180deg, #9a6438 0%, #7a4a26 40%, #4e2c14 100%); box-shadow: inset 0 1px 0 rgba(255,220,180,0.35), 0 16px 22px rgba(0,0,0,0.55)"></div>
<div aria-hidden="true" style="display: flex; justify-content: space-between; padding: 0 16%"><span style="width: 6px; height: 22px; background: linear-gradient(180deg, #2a2a2a, #111)"></span><span style="width: 6px; height: 22px; background: linear-gradient(180deg, #2a2a2a, #111)"></span></div>
</sc-if>
</div>
</sc-for>
</div>
<p style="margin: 8px 0 0; font-size: 12px; color: #A9B6B6">Trophies are illustrative, not replicas of the real statuettes. Years and films marked “confirm” need client sign-off.</p>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: -1 }; }
  renderVals() {
    const black = '#14110f', navy = '#1b2a44';
    const A = [
      { shape: 'cup', metal: 'gold', w: 150, h: 250, base: black, kind: 'Film award', title: 'Filmfare Awards South', count: '×3', detail: 'Three wins across her South Indian work.', when: '[Years · films — confirm]' },
      { shape: 'star', metal: 'gold', w: 110, h: 184, base: black, kind: 'State award', title: 'Tamil Nadu State Film Award', count: 'Best Actress', detail: 'Best Actress.', when: '[Year · film — confirm]' },
      { shape: 'cup', metal: 'silver', w: 120, h: 200, base: navy, kind: 'Critics', title: 'Cinema Express Awards', count: '×4', detail: 'Four wins from the Cinema Express awards.', when: '[Years · films — confirm]' },
      { shape: 'crystal', metal: 'gold', w: 110, h: 184, base: black, kind: 'National', title: 'National Film Award', count: 'Nominee', detail: 'Nominated at the National Film Awards.', when: '[Year · film — confirm]' },
      { shape: 'cup', metal: 'gold', w: 132, h: 220, base: black, kind: 'For one film', title: 'Andhagan', count: '×3', detail: 'Three awards for her role in Andhagan.', when: '[Awards · year — confirm]' },
      { shape: 'cup', metal: 'silver', w: 104, h: 174, base: navy, kind: 'Streaming', title: 'Best Actress — OTT', count: '×1', detail: 'For Paava Kadhaigal.', when: '[Year · awarding body — confirm]' },
      { shape: 'plaque', metal: 'gold', w: 132, h: 160, base: black, kind: 'State honour', title: 'Kalaimamani', count: '×2', detail: 'Tamil Nadu’s honour for contribution to the arts.', when: '[Years — confirm]' }
    ];
    const on = this.state.on;
    const items = A.map((a, k) => {
      const act = k === on;
      return {
        ...a,
        isCup: a.shape === 'cup', isStar: a.shape === 'star', isCrystal: a.shape === 'crystal', isPlaque: a.shape === 'plaque',
        tipId: 'award-tip-' + k,
        aria: a.title + ', ' + a.count,
        tipO: act ? 1 : 0,
        tipY: act ? '0px' : '14px',
        tipS: act ? 1 : 0.92,
        lift: act ? '-10px' : '0px',
        glow: act ? 'drop-shadow(0 0 22px rgba(255,214,150,0.6))' : 'drop-shadow(-8px 12px 10px rgba(0,0,0,0.45))',
        z: act ? 30 : 1,
        on: () => this.setState({ on: k }),
        off: () => { if (this.state.on === k) this.setState({ on: -1 }); }
      };
    });
    const shelves = [
      { left: '2%', top: '40px', width: '46%', plank: true, items: [items[0], items[1], items[2]] },
      { left: '56%', top: '0px', width: '40%', plank: true, items: [items[3], items[5]] },
      { left: '60%', top: '330px', width: '14%', plank: false, items: [items[6]] },
      { left: '8%', top: '400px', width: '42%', plank: true, items: [items[4]] }
    ];
    return { shelves };
  }
}
</script>
</body>
</html>
